name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/smash-game-prototype-m2zdj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Auto-enables GitHub Pages for this repo (no manual Settings click needed)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Pushes a marker tag only if every previous step (incl. Deploy) succeeded.
      # Lets the author verify success remotely via `git ls-remote`.
      - name: Mark deploy success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f pages-live
          git push -f origin pages-live
